name: Compilar APK SoundAlive

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Capacitor y Resolver Dependencias
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "SoundAlive EQ" "com.audio.soundalivelite" --web-dir www
          npx cap add android
          npx cap sync android
          
          # Corrección de clases duplicadas en Kotlin
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.25'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.25'
                  }
              }
          }
          EOF

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: SoundAlive-EQ-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
