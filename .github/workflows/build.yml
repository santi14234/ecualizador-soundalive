name: Compilar APK SoundAlive

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Capacitor, Inyectar Puente Nativo y Permisos
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "SoundAlive EQ" "com.audio.soundalivelite" --web-dir www
          npx cap add android
          npx cap sync android

          # 1. Inyectar permisos de audio y ajustes del sistema
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.WRITE_SETTINGS" \/>' android/app/src/main/AndroidManifest.xml

          # 2. Crear MainActivity.kt con el motor de ecualización nativo
          rm -f android/app/src/main/java/com/audio/soundalivelite/MainActivity.java
          cat << 'EOF' > android/app/src/main/java/com/audio/soundalivelite/MainActivity.kt
          package com.audio.soundalivelite

          import android.os.Bundle
          import android.media.audiofx.Equalizer
          import android.media.audiofx.PresetReverb
          import android.webkit.JavascriptInterface
          import com.getcapacitor.BridgeActivity

          class MainActivity : BridgeActivity() {
              private var equalizer: Equalizer? = null
              private var presetReverb: PresetReverb? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  try {
                      equalizer = Equalizer(0, 0).apply { enabled = true }
                      presetReverb = PresetReverb(0, 0).apply { enabled = true }
                  } catch (e: Exception) {
                      e.printStackTrace()
                  }

                  this.bridge.webView.addJavascriptInterface(object {
                      @JavascriptInterface
                      fun setBandGain(bandIndex: Int, gainMb: Int) {
                          try {
                              equalizer?.setBandLevel(bandIndex.toShort(), gainMb.toShort())
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }

                      @JavascriptInterface
                      fun setReverbPreset(preset: Int) {
                          try {
                              if (preset == 0) {
                                  presetReverb?.enabled = false
                              } else {
                                  presetReverb?.enabled = true
                                  presetReverb?.preset = preset.toShort()
                              }
                          } catch (e: Exception) {
                              e.printStackTrace()
                          }
                      }
                  }, "AndroidAudio")
              }
          }
          EOF

          # 3. Solución para dependencias duplicadas de Kotlin
          cat << 'EOF' >> android/build.gradle

          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.25'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.25'
                      force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.25'
                  }
              }
          }
          EOF

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: SoundAlive-EQ-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
