name: Compilar APK SoundAlive

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Capacitor, Inyectar Puente Nativo Seguro y Permisos
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "SoundAlive EQ" "com.audio.soundalivelite" --web-dir www
          npx cap add android
          npx cap sync android

          # 1. Inyectar permisos de audio y ajustes de sistema en el AndroidManifest
          sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <uses-permission android:name="android.permission.WRITE_SETTINGS" \/>' android/app/src/main/AndroidManifest.xml

          # 2. Crear MainActivity.java nativo y seguro
          cat << 'EOF' > android/app/src/main/java/com/audio/soundalivelite/MainActivity.java
          package com.audio.soundalivelite;

          import android.os.Bundle;
          import android.media.audiofx.Equalizer;
          import android.media.audiofx.PresetReverb;
          import android.webkit.JavascriptInterface;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              private Equalizer equalizer = null;
              private PresetReverb presetReverb = null;

              @Override
              public void onStart() {
                  super.onStart();
                  setupAudioBridge();
              }

              private void setupAudioBridge() {
                  try {
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().addJavascriptInterface(new Object() {
                              @JavascriptInterface
                              public void setBandGain(int bandIndex, int gainMb) {
                                  try {
                                      if (equalizer == null) {
                                          equalizer = new Equalizer(0, 0);
                                          equalizer.setEnabled(true);
                                      }
                                      equalizer.setBandLevel((short) bandIndex, (short) gainMb);
                                  } catch (Exception e) {
                                      e.printStackTrace();
                                  }
                              }

                              @JavascriptInterface
                              public void setReverbPreset(int preset) {
                                  try {
                                      if (presetReverb == null) {
                                          presetReverb = new PresetReverb(0, 0);
                                      }
                                      if (preset == 0) {
                                          presetReverb.setEnabled(false);
                                      } else {
                                          presetReverb.setEnabled(true);
                                          presetReverb.setPreset((short) preset);
                                      }
                                  } catch (Exception e) {
                                      e.printStackTrace();
                                  }
                              }
                          }, "AndroidAudio");
                      }
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }
          }
          EOF

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: SoundAlive-EQ-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
