plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sec.android.app.soundalive'
    compileSdk 33

    defaultConfig {
        applicationId "com.sec.android.app.soundalive"
        minSdk 26 // Android 8.1 Oreo (J2 Core)
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
