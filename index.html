<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundAlive EQ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #121212; color: #ffffff; padding: 16px; }
    .card { background-color: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; color: #aaaaaa; margin-bottom: 16px; }
    
    /* Contenedor del Ecualizador de 10 bandas */
    .eq-container { display: flex; justify-content: space-between; height: 180px; align-items: flex-end; }
    .band { display: flex; flex-direction: column; align-items: center; width: 8%; height: 100%; }
    .slider-vertical {
      writing-mode: bt-lr;
      -webkit-appearance: slider-vertical;
      width: 100%; height: 140px; background: transparent; cursor: pointer;
    }
    .band-label { font-size: 10px; color: #888888; margin-top: 8px; }

    /* Estilos para Bass Boost y Surround */
    .control-group { margin-top: 12px; }
    .control-label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
    .slider-horizontal { width: 100%; accent-color: #007aff; cursor: pointer; }
    
    /* Reverberación */
    select { width: 100%; padding: 10px; border-radius: 8px; background: #2a2a2a; color: white; border: none; margin-top: 8px; }
  </style>
</head>
<body>

  <!-- ECUALIZADOR (10 BANDAS) -->
  <div class="card">
    <h2>Ecualizador (10 Bandas)</h2>
    <div class="eq-container">
      <script>
        const freqs = ['31', '62', '125', '250', '500', '1k', '2k', '4k', '8k', '16k'];
        freqs.forEach((f, i) => {
          document.write(`
            <div class="band">
              <input type="range" class="slider-vertical" min="-1500" max="1500" value="0" oninput="changeEq(${i}, this.value)">
              <span class="band-label">${f}</span>
            </div>
          `);
        });
      </script>
    </div>
  </div>

  <!-- EFECTOS: BASS BOOST & SURROUND (NUEVO) -->
  <div class="card">
    <h2>Efectos de Audio</h2>
    
    <div class="control-group">
      <div class="control-label">
        <span>Potenciador de Bajos (Bass Boost)</span>
        <span id="val-bass">0%</span>
      </div>
      <input type="range" class="slider-horizontal" min="0" max="100" value="0" oninput="changeBass(this.value)">
    </div>

    <div class="control-group" style="margin-top: 18px;">
      <div class="control-label">
        <span>Efecto Envolvente (Surround 3D)</span>
        <span id="val-surround">0%</span>
      </div>
      <input type="range" class="slider-horizontal" min="0" max="100" value="0" oninput="changeSurround(this.value)">
    </div>
  </div>

  <!-- REVERBERACIÓN -->
  <div class="card">
    <h2>Reverberación</h2>
    <select onchange="changeReverb(this.value)">
      <option value="0">Desactivado</option>
      <option value="1">Habitación pequeña</option>
      <option value="2">Habitación mediana</option>
      <option value="3">Habitación grande</option>
      <option value="4">Lobby / Salón</option>
      <option value="5">Sana de conciertos</option>
    </select>
  </div>

  <script>
    function changeEq(band, gain) {
      if (window.AndroidAudio && window.AndroidAudio.setBandGain) {
        window.AndroidAudio.setBandGain(band, parseInt(gain));
      }
    }

    function changeBass(val) {
      document.getElementById('val-bass').innerText = val + '%';
      if (window.AndroidAudio && window.AndroidAudio.setBassBoost) {
        // Android recibe un rango de 0 a 1000
        window.AndroidAudio.setBassBoost(parseInt(val) * 10);
      }
    }

    function changeSurround(val) {
      document.getElementById('val-surround').innerText = val + '%';
      if (window.AndroidAudio && window.AndroidAudio.setVirtualizer) {
        // Android recibe un rango de 0 a 1000
        window.AndroidAudio.setVirtualizer(parseInt(val) * 10);
      }
    }

    function changeReverb(preset) {
      if (window.AndroidAudio && window.AndroidAudio.setReverbPreset) {
        window.AndroidAudio.setReverbPreset(parseInt(preset));
      }
    }
  </script>
</body>
</html>
